name: rac-isolated
services:
  sql:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=$$MSSQL_SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${RAC_ISOLATED_SQL_PASSWORD:?Set an isolated SQL password}"
    volumes:
      - isolated-sql:/var/opt/mssql
    networks:
      - isolated
  api:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == 'HTTP/1.1 200 '* ]]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["initialized"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RAC_SQLSERVER_CONNECTION: "Server=sql;Database=RAC_Isolated;User Id=sa;Password=${RAC_ISOLATED_SQL_PASSWORD:?Set an isolated SQL password};Encrypt=True;TrustServerCertificate=True"
    networks:
      - isolated
    depends_on:
      sql:
        condition: service_healthy
  web:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == 'HTTP/1.1 200 '* ]]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["initialized"]
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RacApi__BaseUrl: http://api:8080
    ports:
      - "127.0.0.1:15081:8080"
    networks:
      - isolated
      - frontend
    depends_on:
      api:
        condition: service_healthy
networks:
  isolated:
    internal: true
  frontend:
    driver: bridge
volumes:
  isolated-sql:
