<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#080b22"/><stop offset=".45" stop-color="#201244"/><stop offset="1" stop-color="#16172a"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#080d2d"/><stop offset=".55" stop-color="#27105d"/><stop offset="1" stop-color="#6c2888"/></linearGradient>
 <linearGradient id="floor" x2=".2" y2="1"><stop stop-color="#312c4e"/><stop offset=".4" stop-color="#1e1e38"/><stop offset="1" stop-color="#0c142a"/></linearGradient>
 <radialGradient id="blue"><stop stop-color="#04cafa" stop-opacity=".35"/><stop offset="1" stop-color="#04cafa" stop-opacity="0"/></radialGradient>
 <radialGradient id="purple"><stop stop-color="#ad4aff" stop-opacity=".32"/><stop offset="1" stop-color="#ad4aff" stop-opacity="0"/></radialGradient>
 <radialGradient id="gold"><stop stop-color="#ffbc53" stop-opacity=".26"/><stop offset="1" stop-color="#ffbc53" stop-opacity="0"/></radialGradient>
 <pattern id="windows" width="55" height="37" patternUnits="userSpaceOnUse"><rect width="55" height="37" fill="none"/><rect x="7" y="7" width="3" height="5" fill="#c46ef9" opacity=".4"/><rect x="26" y="19" width="4" height="7" fill="#9bafff" opacity=".37"/><rect x="42" y="6" width="2" height="3" fill="#ffbfea" opacity=".5"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1440" height="840" fill="url(#wall)"/>
