alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
rule_files:
  - /etc/prometheus/alerts.yml
global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: rac-prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: rac-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://api:8080/api/health', 'http://web:8080/api/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: rac-sql-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['sql:1433']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: rac-container-metrics
    static_configs:
      - targets: ['container-metrics:9100']
