groups:
  - name: rac-availability
    rules:
      - alert: RacServiceUnavailable
        expr: probe_success{job="rac-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RAC service unavailable: {{ $labels.instance }}"
      - alert: RacServiceSlow
        expr: probe_duration_seconds{job="rac-http"} > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "RAC service response exceeds 2 seconds"
      - alert: RacProbeCollectionFailed
        expr: up{job="rac-http"} == 0 or absent(up{job="rac-http"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RAC probe collection failed"
