services:
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:19093:9093"
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - frontend
volumes:
  alertmanager-data:
